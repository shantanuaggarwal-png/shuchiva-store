<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Shuchiva Essentials</title>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Shiprocket Fastrr Headless Login Script -->
    <script src="https://fastrr-boost-ui.pickrr.com/assets/js/channels/login.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background-color: #0d1117; color: #ffffff; font-family: 'Segoe UI', Roboto, sans-serif; }
        .cart-wrapper { max-width: 1200px; margin: 4rem auto; padding: 0 2rem; }
        .page-header { margin-bottom: 3rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
        .page-header h1 { font-size: 2.5rem; font-weight: 300; margin: 0 0 10px 0; letter-spacing: 1px; }
        .page-header p { color: #a3b3c8; margin: 0; font-size: 1.1rem; }
        
        .cart-layout { display: flex; gap: 3rem; flex-wrap: wrap; align-items: flex-start; }
        .cart-items-section { flex: 1 1 550px; }
        .summary-section { flex: 0 1 420px; background-color: #161b22; padding: 2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); position: sticky; top: 2rem; }
        
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem; background-color: #161b22; border-radius: 8px; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.05); }
        .item-main { display: flex; gap: 1.5rem; align-items: center; }
        .cart-item-img { width: 90px; height: 90px; object-fit: contain; border-radius: 8px; background-color: #1c232e; border: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
        
        .item-details { display: flex; flex-direction: column; gap: 6px; }
        .item-title { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .item-meta { color: #8b9eb7; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .item-price { font-size: 1.2rem; font-weight: 700; color: #4da8da; margin-top: 5px; }
        
        .item-actions { text-align: right; }
        .remove-btn { background: none; border: none; color: #ff6b6b; font-size: 0.9rem; cursor: pointer; text-decoration: underline; margin-top: 10px; transition: color 0.2s; }
        .remove-btn:hover { color: #ff4c4c; }

        .summary-title { font-size: 1.5rem; font-weight: 400; margin-top: 0; margin-bottom: 1.5rem; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 1rem; color: #a3b3c8; font-size: 1.05rem; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); font-size: 1.4rem; font-weight: 700; color: #fff; }

        .checkout-btn { width: 100%; padding: 16px; background-color: #4da8da; color: #0d1117; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 1.5rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .checkout-btn:hover { background-color: #3a8ebd; }
        .checkout-btn:disabled { background-color: #2a5a75; cursor: not-allowed; color: #8b9eb7; }
        
        .empty-cart { text-align: center; color: #a3b3c8; font-size: 1.2rem; padding: 4rem 0; width: 100%; }

        /* --- ADDRESS MODAL STYLES --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; box-sizing: border-box; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #161b22; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .modal-header h2 { margin: 0; font-size: 1.5rem; font-weight: 400; color: #fff; }
        .modal-close { background: none; border: none; color: #a3b3c8; font-size: 1.5rem; cursor: pointer; line-height: 1; }
        .modal-close:hover { color: #fff; }
        
        .address-option { display: flex; align-items: flex-start; gap: 12px; padding: 1rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s, background-color 0.2s; background: #0d1117; }
        .address-option:hover, .address-option.selected { border-color: #4da8da; background-color: #1c2430; }
        .address-option input[type="radio"] { margin-top: 4px; accent-color: #4da8da; cursor: pointer; }
        .address-option-details { font-size: 0.95rem; color: #a3b3c8; line-height: 1.4; }
        .address-option-details strong { color: #fff; display: block; margin-bottom: 4px; }
        
        .new-addr-btn { background: none; border: 1px dashed rgba(255,255,255,0.2); color: #4da8da; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; margin-bottom: 1.5rem; transition: 0.2s; }
        .new-addr-btn:hover { border-color: #4da8da; background: rgba(77, 168, 218, 0.05); }

        .modal-form { display: none; margin-bottom: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem; }
        .modal-form.active { display: block; }
        .form-row { margin-bottom: 12px; }
        .form-row label { display: block; font-size: 0.85rem; color: #a3b3c8; margin-bottom: 4px; }
        .form-row input { width: 100%; box-sizing: border-box; padding: 10px 12px; background: #0d1117; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; font-size: 0.95rem; }
        .form-row input:focus { outline: none; border-color: #4da8da; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .modal-actions { display: flex; gap: 12px; margin-top: 1.5rem; }
        .modal-btn-cancel { flex: 1; padding: 12px; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #a3b3c8; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .modal-btn-pay { flex: 2; padding: 12px; background: #4da8da; border: none; color: #0d1117; border-radius: 6px; cursor: pointer; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .modal-btn-pay:hover { background: #3a8ebd; }
        .modal-error { color: #ff6b6b; font-size: 0.9rem; margin-top: 10px; text-align: center; }

        /* Shiprocket Fastrr Express Login Styling */
        .fastrr-login-box {
            background: linear-gradient(135deg, rgba(77, 168, 218, 0.12), rgba(128, 0, 32, 0.2));
            border: 1px solid rgba(77, 168, 218, 0.35);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .fastrr-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .fastrr-info-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .fastrr-info-subtitle {
            font-size: 0.8rem;
            color: #a3b3c8;
        }
        .fastrr-btn {
            background: linear-gradient(135deg, #4da8da, #3a8ebd);
            color: #0d1117;
            font-weight: 700;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(77, 168, 218, 0.25);
        }
        .fastrr-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(77, 168, 218, 0.4);
            background: #5bb3e3;
        }
        .fastrr-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <site-toolbar root-path="../"></site-toolbar>

    <div class="cart-wrapper">
        <div class="page-header">
            <h1>Shopping Cart</h1>
            <p>Review your selected items before proceeding to secure checkout.</p>
        </div>
        
        <div class="cart-layout" id="cart-content">
            <h3 style="text-align: center; width: 100%;">Loading your cart...</h3>
        </div>
    </div>

    <script>
        async function parseJsonResponse(res) {
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                console.error("Non-JSON Response received:", text.slice(0, 150));
                return { error: "A server or cache update occurred. Please refresh your page." };
            }
        }

        async function loadCart() {
            const token = localStorage.getItem('shuchiva_token');
            const contentDiv = document.getElementById('cart-content');

            if (!token) {
                contentDiv.innerHTML = `<div class="empty-cart">Please <a href="../auth/login.html" style="color: #4da8da;">log in</a> to view your cart.</div>`;
                return;
            }

            try {
                const [cartRes, productRes] = await Promise.all([
                    fetch('/api/cart', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('/api/products')
                ]);

                const cartData = await parseJsonResponse(cartRes);
                const catalog = await parseJsonResponse(productRes);

                if (!cartData.items || cartData.items.length === 0) {
                    contentDiv.innerHTML = `<div class="empty-cart">Your cart is currently empty.</div>`;
                    window.dispatchEvent(new Event('cartUpdated'));
                    return;
                }

                let itemsHTML = '';
                let totalAmount = 0;
                let totalQty = 0;

                cartData.items.forEach(item => {
                    const productDetails = catalog[item.productId];
                    const name = productDetails ? productDetails.productName : 'Unknown Product';
                    
                    let imgPath = '';
                    if (productDetails && productDetails.sizes && productDetails.sizes[item.sizeKey]) {
                        const sizeData = productDetails.sizes[item.sizeKey];
                        const packData = sizeData.packs[item.packKey];
                        if (packData && packData.mainImg) {
                            imgPath = `../homepage/products/${sizeData.folderName}/${packData.mainImg}`;
                        }
                    }
                    const imgTag = imgPath ? `<img src="${imgPath}" alt="${name}" class="cart-item-img" loading="lazy">` : `<div class="cart-item-img"></div>`;
                    
                    const numericalPrice = parseInt(item.price.replace(/[^0-9]/g, ''), 10) || 0;
                    totalAmount += (numericalPrice * item.quantity);
                    totalQty += item.quantity;
                    
                    itemsHTML += `
                        <div class="cart-item">
                            <div class="item-main">
                                ${imgTag}
                                <div class="item-details">
                                    <span class="item-title">${name}</span>
                                    <span class="item-meta">Size: ${item.sizeKey} | Pack: ${item.packKey}</span>
                                    <span class="item-price">${item.price} (Qty: ${item.quantity})</span>
                                </div>
                            </div>
                            <div class="item-actions">
                                <button class="remove-btn" onclick="removeItem('${item.productId}', '${item.sizeKey}', '${item.packKey}')">Remove Item</button>
                            </div>
                        </div>
                    `;
                });

                contentDiv.innerHTML = `
                    <div class="cart-items-section">
                        ${itemsHTML}
                    </div>
                    <div class="summary-section">
                        <h3 class="summary-title">Order Summary</h3>
                        <div class="summary-row">
                            <span>Subtotal (${totalQty} items)</span>
                            <span>₹${totalAmount}</span>
                        </div>
                        <div class="summary-total">
                            <span>Total</span>
                            <span>₹${totalAmount}</span>
                        </div>
                        <button class="checkout-btn" onclick="openAddressModal()">Proceed to Checkout</button>
                    </div>
                `;

                window.dispatchEvent(new Event('cartUpdated'));

                // Image error fallback
                const cartImages = document.querySelectorAll('.cart-item-img');
                cartImages.forEach(img => {
                    img.onerror = function() {
                        if (this.src.includes('.webp')) {
                            this.src = this.src.replace('.webp', '.png');
                        } else if (this.src.includes('.png')) {
                            this.src = this.src.replace('.png', '.jpg');
                        } else if (this.src.includes('.jpg')) {
                            this.src = this.src.replace('.jpg', '.jpeg');
                        } else {
                            this.onerror = null; 
                        }
                    };
                });

            } catch (error) {
                console.error("Cart Error:", error);
                contentDiv.innerHTML = `<div class="empty-cart" style="color: #ff6b6b;">Failed to load cart. Please try again.</div>`;
            }
        }

        async function removeItem(productId, sizeKey, packKey) {
            const token = localStorage.getItem('shuchiva_token');
            try {
                const response = await fetch('/api/cart/remove', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ productId, sizeKey, packKey })
                });

                if (response.ok) loadCart();
            } catch (error) {
                console.error("Remove Error:", error);
            }
        }

        // --- DELIVERY ADDRESS & CHECKOUT LOGIC ---
        let savedUserAddresses = [];
        let useNewAddress = false;

        async function openAddressModal() {
            const token = localStorage.getItem('shuchiva_token');
            if (!token) {
                alert('Please log in to proceed to checkout.');
                window.location.href = '../auth/login.html';
                return;
            }

            const modal = document.getElementById('address-modal');
            const listDiv = document.getElementById('saved-addresses-list');
            const form = document.getElementById('new-address-form');
            const errorBox = document.getElementById('modal-error-box');
            errorBox.textContent = '';

            try {
                const res = await fetch('/api/user/addresses', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await parseJsonResponse(res);
                savedUserAddresses = data.addresses || [];

                if (savedUserAddresses.length > 0) {
                    useNewAddress = false;
                    form.classList.remove('active');
                    document.getElementById('toggle-new-addr-btn').style.display = 'block';

                    listDiv.innerHTML = savedUserAddresses.map((addr, idx) => `
                        <label class="address-option ${idx === 0 ? 'selected' : ''}" onclick="selectAddressCard(${idx})">
                            <input type="radio" name="selected_address" value="${idx}" ${idx === 0 ? 'checked' : ''}>
                            <div class="address-option-details">
                                <strong>${addr.fullName} &bull; ${addr.phone}</strong>
                                ${addr.address}<br>
                                ${addr.city}, ${addr.state} - ${addr.pincode}
                            </div>
                        </label>
                    `).join('');
                } else {
                    // No saved addresses, open the new address form directly
                    useNewAddress = true;
                    listDiv.innerHTML = '<p style="color: #a3b3c8; margin-bottom: 1rem; font-size: 0.95rem;">Enter your shipping address for courier delivery:</p>';
                    form.classList.add('active');
                    document.getElementById('toggle-new-addr-btn').style.display = 'none';

                    // Prefill name if available
                    const savedName = localStorage.getItem('shuchiva_user_name');
                    if (savedName && savedName !== 'Customer') {
                        document.getElementById('modal-name').value = savedName;
                    }
                }

                modal.classList.add('active');
            } catch (err) {
                console.error("Failed to fetch addresses:", err);
                alert("Could not load address details. Please try again.");
            }
        }

        function closeAddressModal() {
            const modal = document.getElementById('address-modal');
            modal.classList.remove('active');
        }

        function selectAddressCard(index) {
            useNewAddress = false;
            document.querySelectorAll('.address-option').forEach((el, idx) => {
                el.classList.toggle('selected', idx === index);
            });
            const radio = document.querySelector(`input[name="selected_address"][value="${index}"]`);
            if (radio) radio.checked = true;
        }

        function toggleNewAddressForm() {
            const form = document.getElementById('new-address-form');
            useNewAddress = !useNewAddress;
            if (useNewAddress) {
                form.classList.add('active');
                document.querySelectorAll('input[name="selected_address"]').forEach(r => r.checked = false);
                document.querySelectorAll('.address-option').forEach(el => el.classList.remove('selected'));
                document.getElementById('toggle-new-addr-btn').textContent = "Use a saved address above";
            } else {
                form.classList.remove('active');
                if (savedUserAddresses.length > 0) selectAddressCard(0);
                document.getElementById('toggle-new-addr-btn').textContent = "+ Add New Delivery Address";
            }
        }

        // --- SHIPROCKET FASTRR 1-CLICK OTP LOGIN ---
        async function triggerFastrrLogin(event) {
            const btn = document.getElementById('fastrr-trigger-btn');
            const originalHTML = btn ? btn.innerHTML : '⚡ OTP Login';
            const errorBox = document.getElementById('modal-error-box');
            if (errorBox) errorBox.textContent = '';

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<span>Connecting...</span>';
                }

                // 1. Fetch Fastrr access token from our backend S2S endpoint
                const tokenRes = await fetch('/api/shiprocket/access-token', { method: 'POST' });
                const tokenData = await parseJsonResponse(tokenRes);

                if (!tokenData || !tokenData.token) {
                    throw new Error(tokenData.error || "Unable to initialize Fastrr session.");
                }

                // Wait for HeadlessCheckout / ShiprocketLogin library if still loading
                const checkoutLib = window.HeadlessCheckout || window.ShiprocketLogin;
                if (!checkoutLib || typeof checkoutLib.login !== 'function') {
                    throw new Error("Fastrr checkout service is loading, please try again in a few seconds.");
                }

                checkoutLib.login(
                    event,
                    tokenData.token,
                    {
                        domain: window.location.hostname || 'shuchiva-store.onrender.com',
                        redirection_url: window.location.href,
                        themecolor: '#4da8da'
                    },
                    function (customerData) {
                        console.log("Fastrr login callback received:", customerData);
                        if (btn) {
                            btn.disabled = false;
                            btn.innerHTML = originalHTML;
                        }

                        if (!customerData) return;

                        // Extract address & contact details flexibly across Fastrr payload schemas
                        const customer = customerData.customer || customerData.user || {};
                        const addr = (Array.isArray(customerData.addresses) && customerData.addresses[0]) || 
                                     customerData.address || 
                                     customerData.shipping_address || 
                                     customerData;

                        const name = (addr.fullName || addr.name || customer.name || 
                                     `${customer.first_name || customerData.first_name || ''} ${customer.last_name || customerData.last_name || ''}`.trim() || 
                                     '').trim();
                        const phone = (addr.phone || addr.contact || customer.phone || customerData.phone || '').toString().replace(/[^0-9]/g, '');
                        const street = (addr.address || addr.address1 || addr.street || addr.street_address || '').trim();
                        const city = (addr.city || '').trim();
                        const state = (addr.state || '').trim();
                        const pincode = (addr.pincode || addr.pin || addr.zipcode || '').toString().trim();

                        // Switch to new address form and populate
                        useNewAddress = true;
                        const form = document.getElementById('new-address-form');
                        form.classList.add('active');
                        document.querySelectorAll('input[name="selected_address"]').forEach(r => r.checked = false);
                        document.querySelectorAll('.address-option').forEach(el => el.classList.remove('selected'));
                        const toggleBtn = document.getElementById('toggle-new-addr-btn');
                        if (toggleBtn) toggleBtn.textContent = "Use a saved address above";

                        if (name) document.getElementById('modal-name').value = name;
                        if (phone) document.getElementById('modal-phone').value = phone.slice(-10);
                        if (street) document.getElementById('modal-street').value = street;
                        if (city) document.getElementById('modal-city').value = city;
                        if (state) document.getElementById('modal-state').value = state;
                        if (pincode) document.getElementById('modal-pin').value = pincode;

                        // Asynchronously save this address to user profile if logged in
                        const token = localStorage.getItem('shuchiva_token');
                        if (token && name && phone && street && pincode) {
                            fetch('/api/user/addresses', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify({ fullName: name, phone: phone.slice(-10), address: street, city, state, pincode })
                            }).catch(console.error);
                        }
                    }
                );
            } catch (err) {
                console.error("Fastrr Error:", err);
                if (errorBox) errorBox.textContent = err.message || "Failed to start Fastrr mobile login.";
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalHTML;
                }
            }
        }

        async function confirmAddressAndPay() {
            const token = localStorage.getItem('shuchiva_token');
            const errorBox = document.getElementById('modal-error-box');
            errorBox.textContent = '';

            let shippingAddress = null;

            if (useNewAddress || savedUserAddresses.length === 0) {
                const fullName = document.getElementById('modal-name').value.trim();
                const phone = document.getElementById('modal-phone').value.trim().replace(/[^0-9]/g, '');
                const address = document.getElementById('modal-street').value.trim();
                const city = document.getElementById('modal-city').value.trim();
                const pincode = document.getElementById('modal-pin').value.trim();
                const state = document.getElementById('modal-state').value.trim();
                const shouldSave = document.getElementById('modal-save-addr').checked;

                if (!fullName || !phone || !address || !city || !state || !pincode) {
                    errorBox.textContent = "Please fill in all address fields.";
                    return;
                }

                if (phone.length < 10) {
                    errorBox.textContent = "Please enter a valid 10-digit phone number.";
                    return;
                }

                if (pincode.length !== 6) {
                    errorBox.textContent = "Please enter a valid 6-digit Indian PIN code.";
                    return;
                }

                shippingAddress = { fullName, phone, address, city, state, pincode };

                if (shouldSave) {
                    // Save address asynchronously
                    fetch('/api/user/addresses', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(shippingAddress)
                    }).catch(console.error);
                }
            } else {
                const checkedRadio = document.querySelector('input[name="selected_address"]:checked');
                if (!checkedRadio) {
                    errorBox.textContent = "Please select or add a delivery address.";
                    return;
                }
                const selectedIdx = parseInt(checkedRadio.value, 10);
                shippingAddress = savedUserAddresses[selectedIdx];
            }

            if (!shippingAddress) {
                errorBox.textContent = "Please provide a delivery address.";
                return;
            }

            closeAddressModal();
            triggerRazorpayCheckout(shippingAddress);
        }

        // --- RAZORPAY NATIVE PAYMENT & SHIPROCKET FULFILLMENT ---
        async function triggerRazorpayCheckout(shippingAddress) {
            const token = localStorage.getItem('shuchiva_token');
            const checkoutBtn = document.querySelector('.checkout-btn');
            if (checkoutBtn) {
                checkoutBtn.textContent = "Opening Payment Gateway...";
                checkoutBtn.disabled = true;
            }

            try {
                // 1. Fetch public Razorpay Key & Create Order
                const [keyRes, orderRes] = await Promise.all([
                    fetch('/api/payment/key'),
                    fetch('/api/payment/create-order', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);

                const keyData = await parseJsonResponse(keyRes);
                const orderData = await parseJsonResponse(orderRes);

                if (orderData.error) {
                    alert(orderData.error);
                    if (checkoutBtn) { checkoutBtn.textContent = "Proceed to Checkout"; checkoutBtn.disabled = false; }
                    return;
                }

                const razorpayKey = keyData.key;
                if (!razorpayKey) {
                    alert("Payment configuration error: Razorpay Key not found.");
                    if (checkoutBtn) { checkoutBtn.textContent = "Proceed to Checkout"; checkoutBtn.disabled = false; }
                    return;
                }

                const options = {
                    key: razorpayKey,
                    amount: orderData.amount,
                    currency: "INR",
                    name: "Shuchiva Essentials",
                    description: "Order Checkout & Courier Shipping",
                    order_id: orderData.id,
                    prefill: {
                        name: shippingAddress.fullName || localStorage.getItem('shuchiva_user_name') || "",
                        contact: shippingAddress.phone || "",
                        email: ""
                    },
                    theme: {
                        color: "#4da8da"
                    },
                    handler: async function (response) {
                        if (checkoutBtn) checkoutBtn.textContent = "Verifying & Assigning Courier...";
                        
                        try {
                            const verifyRes = await fetch('/api/payment/verify', {
                                method: 'POST',
                                headers: { 
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}` 
                                },
                                body: JSON.stringify({
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature,
                                    delivery_address: shippingAddress
                                })
                            });

                            const verifyData = await parseJsonResponse(verifyRes);

                            if (verifyRes.ok) {
                                let msg = 'Order placed successfully!';
                                if (verifyData.shipmentId) {
                                    msg += `\nShiprocket Shipment ID: ${verifyData.shipmentId}`;
                                }
                                alert(msg);
                                window.location.href = '../account/orders.html';
                            } else {
                                alert(verifyData.error || 'Payment verification failed.');
                            }
                        } catch (err) {
                            console.error("Verification Error:", err);
                            alert("Order verification encountered an error. If your amount was deducted, your order will be automatically synced via webhook.");
                            window.location.href = '../account/orders.html';
                        }
                    },
                    modal: {
                        ondismiss: function() {
                            if (checkoutBtn) {
                                checkoutBtn.textContent = "Proceed to Checkout";
                                checkoutBtn.disabled = false;
                            }
                        }
                    }
                };

                const rzp = new Razorpay(options);
                rzp.open();

            } catch (error) {
                console.error("Checkout Error:", error);
                alert("Failed to initiate payment gateway. Please check your connection.");
                if (checkoutBtn) {
                    checkoutBtn.textContent = "Proceed to Checkout";
                    checkoutBtn.disabled = false;
                }
            }
        }

        loadCart();
    </script>

    <!-- Delivery Address Modal -->
    <div class="modal-overlay" id="address-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Delivery Address</h2>
                <button class="modal-close" onclick="closeAddressModal()">&times;</button>
            </div>
            
            <!-- Fastrr 1-Click Mobile Login Box -->
            <div class="fastrr-login-box">
                <div class="fastrr-info">
                    <div class="fastrr-info-title">
                        <span>⚡ Express Checkout (Fastrr)</span>
                    </div>
                    <div class="fastrr-info-subtitle">Auto-fill saved address using Mobile OTP</div>
                </div>
                <button type="button" class="fastrr-btn" id="fastrr-trigger-btn" onclick="triggerFastrrLogin(event)">
                    <span>⚡ OTP Login</span>
                </button>
            </div>

            <div id="saved-addresses-list">
                <!-- Dynamically loaded saved addresses -->
            </div>

            <button type="button" class="new-addr-btn" id="toggle-new-addr-btn" onclick="toggleNewAddressForm()">+ Add New Delivery Address</button>

            <form id="new-address-form" class="modal-form" onsubmit="event.preventDefault(); confirmAddressAndPay();">
                <div class="form-row">
                    <label>Full Name *</label>
                    <input type="text" id="modal-name" placeholder="Receiver's full name" required>
                </div>
                <div class="form-row">
                    <label>Phone Number (10 digits) *</label>
                    <input type="tel" id="modal-phone" maxlength="10" placeholder="e.g. 9876543210" required>
                </div>
                <div class="form-row">
                    <label>Street Address / Flat / Building *</label>
                    <input type="text" id="modal-street" placeholder="House/Flat No., Street, Landmark" required>
                </div>
                <div class="form-grid-2">
                    <div class="form-row">
                        <label>City *</label>
                        <input type="text" id="modal-city" placeholder="City" required>
                    </div>
                    <div class="form-row">
                        <label>Pincode *</label>
                        <input type="text" id="modal-pin" maxlength="6" placeholder="6-digit PIN" required>
                    </div>
                </div>
                <div class="form-row">
                    <label>State *</label>
                    <input type="text" id="modal-state" placeholder="State" required>
                </div>
                <div class="form-row" style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
                    <input type="checkbox" id="modal-save-addr" checked style="width: auto;">
                    <label for="modal-save-addr" style="margin: 0; color: #fff; cursor: pointer;">Save this address for future orders</label>
                </div>
            </form>

            <div class="modal-error" id="modal-error-box"></div>

            <div class="modal-actions">
                <button type="button" class="modal-btn-cancel" onclick="closeAddressModal()">Cancel</button>
                <button type="button" class="modal-btn-pay" id="confirm-pay-btn" onclick="confirmAddressAndPay()">Proceed to Payment</button>
            </div>
        </div>
    </div>

    <script src="../homepage/toolbar.js"></script>
</body>
</html>
