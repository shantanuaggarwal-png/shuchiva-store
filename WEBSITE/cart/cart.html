<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Shuchiva Essentials</title>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background-color: #0d1117; color: #ffffff; font-family: 'Segoe UI', Roboto, sans-serif; }
        .cart-wrapper { max-width: 1200px; margin: 4rem auto; padding: 0 2rem; }
        .page-header { margin-bottom: 3rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
        .page-header h1 { font-size: 2.5rem; font-weight: 300; margin: 0 0 10px 0; letter-spacing: 1px; }
        .page-header p { color: #a3b3c8; margin: 0; font-size: 1.1rem; }
        
        .cart-layout { display: flex; gap: 3rem; flex-wrap: wrap; align-items: flex-start; }
        .cart-items-section { flex: 1 1 550px; }
        .summary-section { flex: 0 1 420px; background-color: #161b22; padding: 2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); position: sticky; top: 2rem; }
        
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem; background-color: #161b22; border-radius: 8px; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.05); }
        .item-main { display: flex; gap: 1.5rem; align-items: center; }
        .cart-item-img { width: 90px; height: 90px; object-fit: contain; border-radius: 8px; background-color: #1c232e; border: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
        
        .item-details { display: flex; flex-direction: column; gap: 6px; }
        .item-title { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .item-meta { color: #8b9eb7; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .item-price { font-size: 1.2rem; font-weight: 700; color: #4da8da; margin-top: 5px; }
        
        .item-actions { text-align: right; }
        .remove-btn { background: none; border: none; color: #ff6b6b; font-size: 0.9rem; cursor: pointer; text-decoration: underline; margin-top: 10px; transition: color 0.2s; }
        .remove-btn:hover { color: #ff4c4c; }

        .summary-title { font-size: 1.5rem; font-weight: 400; margin-top: 0; margin-bottom: 1.5rem; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 1rem; color: #a3b3c8; font-size: 1.05rem; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); font-size: 1.4rem; font-weight: 700; color: #fff; }

        /* Shipping Form Styling */
        .shipping-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
        .shipping-title { font-size: 1.2rem; font-weight: 500; margin: 0 0 1rem 0; color: #fff; }
        .form-field { margin-bottom: 0.85rem; }
        .form-field label { display: block; font-size: 0.85rem; color: #a3b3c8; margin-bottom: 4px; }
        .form-field input { width: 100%; padding: 10px 12px; box-sizing: border-box; background-color: #0d1117; border: 1px solid rgba(255,255,255,0.15); color: #fff; border-radius: 6px; font-size: 0.95rem; }
        .form-field input:focus { outline: none; border-color: #4da8da; }
        .form-row-2 { display: flex; gap: 10px; }
        .form-row-2 .form-field { flex: 1; }
        
        .checkout-btn { width: 100%; padding: 16px; background-color: #4da8da; color: #0d1117; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 1.5rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .checkout-btn:hover { background-color: #3a8ebd; }
        
        .empty-cart { text-align: center; color: #a3b3c8; font-size: 1.2rem; padding: 4rem 0; width: 100%; }
    </style>
</head>
<body>

    <site-toolbar root-path="../"></site-toolbar>

    <div class="cart-wrapper">
        <div class="page-header">
            <h1>Shopping Cart</h1>
            <p>Review your selected items and shipping details before proceeding to secure checkout.</p>
        </div>
        
        <div class="cart-layout" id="cart-content">
            <h3 style="text-align: center; width: 100%;">Loading your cart...</h3>
        </div>
    </div>

    <script>
        async function loadCart() {
            const token = localStorage.getItem('shuchiva_token');
            const contentDiv = document.getElementById('cart-content');

            if (!token) {
                contentDiv.innerHTML = `<div class="empty-cart">Please <a href="../auth/login.html" style="color: #4da8da;">log in</a> to view your cart.</div>`;
                return;
            }

            try {
                const [cartRes, productRes] = await Promise.all([
                    fetch('/api/cart', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('/api/products')
                ]);

                const cartData = await cartRes.json();
                const catalog = await productRes.json();

                if (!cartData.items || cartData.items.length === 0) {
                    contentDiv.innerHTML = `<div class="empty-cart">Your cart is currently empty.</div>`;
                    window.dispatchEvent(new Event('cartUpdated'));
                    return;
                }

                let itemsHTML = '';
                let totalAmount = 0;
                let totalQty = 0;

                cartData.items.forEach(item => {
                    const productDetails = catalog[item.productId];
                    const name = productDetails ? productDetails.productName : 'Unknown Product';
                    
                    let imgPath = '';
                    if (productDetails && productDetails.sizes && productDetails.sizes[item.sizeKey]) {
                        const sizeData = productDetails.sizes[item.sizeKey];
                        const packData = sizeData.packs[item.packKey];
                        if (packData && packData.mainImg) {
                            imgPath = `../homepage/products/${sizeData.folderName}/${packData.mainImg}`;
                        }
                    }
                    const imgTag = imgPath ? `<img src="${imgPath}" alt="${name}" class="cart-item-img" loading="lazy">` : `<div class="cart-item-img"></div>`;
                    
                    const numericalPrice = parseInt(item.price.replace(/[^0-9]/g, ''), 10) || 0;
                    totalAmount += (numericalPrice * item.quantity);
                    totalQty += item.quantity;
                    
                    itemsHTML += `
                        <div class="cart-item">
                            <div class="item-main">
                                ${imgTag}
                                <div class="item-details">
                                    <span class="item-title">${name}</span>
                                    <span class="item-meta">Size: ${item.sizeKey} | Pack: ${item.packKey}</span>
                                    <span class="item-price">${item.price} (Qty: ${item.quantity})</span>
                                </div>
                            </div>
                            <div class="item-actions">
                                <button class="remove-btn" onclick="removeItem('${item.productId}', '${item.sizeKey}', '${item.packKey}')">Remove Item</button>
                            </div>
                        </div>
                    `;
                });

                const savedName = localStorage.getItem('shuchiva_user_name') || '';

                contentDiv.innerHTML = `
                    <div class="cart-items-section">
                        ${itemsHTML}
                    </div>
                    <div class="summary-section">
                        <h3 class="summary-title">Order Summary</h3>
                        <div class="summary-row">
                            <span>Subtotal (${totalQty} items)</span>
                            <span>₹${totalAmount}</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span style="color: #4da8da;">Calculated at checkout</span>
                        </div>
                        <div class="summary-total">
                            <span>Total</span>
                            <span>₹${totalAmount}</span>
                        </div>

                        <!-- Delivery Address Form Required for Shiprocket -->
                        <div class="shipping-section">
                            <h4 class="shipping-title">Delivery Address</h4>
                            <div class="form-field">
                                <label for="ship-name">Full Name *</label>
                                <input type="text" id="ship-name" placeholder="Receiver full name" value="${savedName}" required>
                            </div>
                            <div class="form-field">
                                <label for="ship-phone">Phone Number (10 digits) *</label>
                                <input type="tel" id="ship-phone" placeholder="9876543210" maxlength="10" required>
                            </div>
                            <div class="form-field">
                                <label for="ship-address">Street Address / House No. *</label>
                                <input type="text" id="ship-address" placeholder="Flat, building, area, street" required>
                            </div>
                            <div class="form-row-2">
                                <div class="form-field">
                                    <label for="ship-city">City *</label>
                                    <input type="text" id="ship-city" placeholder="e.g. Dehradun" required>
                                </div>
                                <div class="form-field">
                                    <label for="ship-pincode">Pincode *</label>
                                    <input type="text" id="ship-pincode" placeholder="6 digits" maxlength="6" required>
                                </div>
                            </div>
                            <div class="form-field">
                                <label for="ship-state">State *</label>
                                <input type="text" id="ship-state" placeholder="e.g. Uttarakhand" required>
                            </div>
                        </div>

                        <button class="checkout-btn" onclick="processCheckout()">Proceed to Checkout</button>
                    </div>
                `;

                window.dispatchEvent(new Event('cartUpdated'));

                // Image error fallback
                const cartImages = document.querySelectorAll('.cart-item-img');
                cartImages.forEach(img => {
                    img.onerror = function() {
                        if (this.src.includes('.webp')) {
                            this.src = this.src.replace('.webp', '.png');
                        } else if (this.src.includes('.png')) {
                            this.src = this.src.replace('.png', '.jpg');
                        } else if (this.src.includes('.jpg')) {
                            this.src = this.src.replace('.jpg', '.jpeg');
                        } else {
                            this.onerror = null; 
                        }
                    };
                });

            } catch (error) {
                console.error("Cart Error:", error);
                contentDiv.innerHTML = `<div class="empty-cart" style="color: #ff6b6b;">Failed to load cart. Please try again.</div>`;
            }
        }

        async function removeItem(productId, sizeKey, packKey) {
            const token = localStorage.getItem('shuchiva_token');
            try {
                const response = await fetch('/api/cart/remove', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ productId, sizeKey, packKey })
                });

                if (response.ok) {
                    loadCart();
                } else {
                    alert("Failed to remove item.");
                }
            } catch (error) {
                console.error("Remove Error:", error);
            }
        }

        async function processCheckout() {
            const token = localStorage.getItem('shuchiva_token');
            if (!token) return alert('Please log in first.');

            // 1. Validate shipping fields
            const fullName = document.getElementById('ship-name').value.trim();
            const phone = document.getElementById('ship-phone').value.trim();
            const address = document.getElementById('ship-address').value.trim();
            const city = document.getElementById('ship-city').value.trim();
            const pincode = document.getElementById('ship-pincode').value.trim();
            const state = document.getElementById('ship-state').value.trim();

            if (!fullName || !phone || !address || !city || !pincode || !state) {
                return alert('Please fill in all required delivery address fields.');
            }

            if (!/^\d{10}$/.test(phone)) {
                return alert('Please enter a valid 10-digit mobile number.');
            }

            if (!/^\d{6}$/.test(pincode)) {
                return alert('Please enter a valid 6-digit postal pincode.');
            }

            const shippingAddress = { fullName, phone, address, city, pincode, state };

            try {
                // 2. Create order on backend
                const orderRes = await fetch('/api/payment/create-order', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const order = await orderRes.json();
                
                if (order.error) return alert(order.error);

                // 3. Open Razorpay modal with customer prefill
                const options = {
                    key: 'rzp_live_TbyT9enQRy7J3V',
                    amount: order.amount,
                    currency: "INR",
                    name: "Shuchiva Essentials",
                    description: "Secure Checkout",
                    order_id: order.id,
                    prefill: {
                        name: fullName,
                        contact: phone
                    },
                    handler: async function (response) {
                        // 4. Send payment signature + address payload together
                        const verifyRes = await fetch('/api/payment/verify', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                ...response,
                                shippingAddress
                            })
                        });
                        
                        const verifyData = await verifyRes.json();
                        if (verifyRes.ok) {
                            alert('Payment successful! Your order has been placed.');
                            window.location.href = '../account/orders.html';
                        } else {
                            alert(verifyData.error || 'Payment verification failed.');
                        }
                    }
                };
                const rzp = new Razorpay(options);
                rzp.open();
            } catch (error) {
                console.error('Checkout error:', error);
                alert('There was a problem initiating checkout.');
            }
        }

        loadCart();
    </script>

    <script src="../homepage/toolbar.js"></script>
</body>
</html>
