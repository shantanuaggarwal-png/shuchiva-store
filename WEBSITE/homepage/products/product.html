<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Shuchiva Essentials</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #0d1117; color: #ffffff; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
        
        /* Shared Navigation Styles */
        nav { position: relative; width: 100%; padding: 2rem; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 100; background-color: #0d1117; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .logo a { color: #fff; text-decoration: none; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { color: #fff; text-decoration: none; margin-left: 2rem; font-size: 0.9rem; transition: color 0.3s ease; display: inline-block; padding: 10px 0; }
        .nav-links a:hover { color: #4da8da; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: rgba(13, 17, 23, 0.95); min-width: 220px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5); z-index: 100; top: 100%; left: 2rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); padding: 10px 0; }
        .dropdown-content a { color: white; padding: 12px 20px; text-decoration: none; display: block; margin-left: 0; font-size: 0.85rem; transition: background-color 0.3s ease, color 0.3s ease; }
        .dropdown-content a:hover { background-color: rgba(77, 168, 218, 0.15); color: #4da8da; }
        .dropdown:hover .dropdown-content { display: block; }

        /* Product Details Layout */
        .product-container { display: flex; flex-wrap: wrap; max-width: 1200px; margin: 4rem auto; padding: 0 2rem; gap: 4rem; min-height: 70vh; }
        .gallery-col { flex: 1 1 500px; }
        
        /* UPDATED: main image box uses object-fit: contain */
        .main-img-box { width: 100%; aspect-ratio: 4/3; background-color: #1c232e; border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.05); }
        .main-img-box img { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        .thumb-grid { display: flex; gap: 12px; flex-wrap: wrap; }
        
        /* UPDATED: thumb box uses object-fit: contain */
        .thumb-box { width: 70px; height: 70px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; background-color: #1c232e; transition: all 0.2s ease; }
        .thumb-box.active, .thumb-box:hover { border-color: #4da8da; }
        .thumb-box img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .info-col { flex: 1 1 400px; display: flex; flex-direction: column; }
        .prod-title { font-size: 2rem; font-weight: 300; margin-top: 0; margin-bottom: 1rem; line-height: 1.3; }
        .prod-price-display { font-size: 2.5rem; font-weight: 700; color: #4da8da; margin-bottom: 1.5rem; }
        .prod-desc-text { color: #a3b3c8; line-height: 1.6; margin-bottom: 2rem; font-size: 1.05rem; }
        
        .option-group { margin-bottom: 2rem; }
        .option-label { display: block; margin-bottom: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; color: #8b9eb7; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .select-btn { padding: 10px 20px; background-color: #161b22; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 6px; cursor: pointer; font-size: 0.95rem; transition: all 0.2s ease; }
        .select-btn:hover { border-color: #4da8da; background-color: rgba(77, 168, 218, 0.1); }
        .select-btn.active { background-color: #4da8da; color: #0d1117; border-color: #4da8da; font-weight: 600; }

        .checkout-btn { width: 100%; padding: 18px; background-color: #4da8da; color: #0d1117; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.2s ease, background-color 0.2s ease; text-align: center; margin-top: auto; }
        .checkout-btn:hover { background-color: #3a8ebd; transform: translateY(-2px); }
        
        #cart-message { margin-top: 15px; text-align: center; font-weight: 600; display: none; }
        
        footer { background-color: #0d1117; color: #6e7d91; text-align: center; padding: 2rem; font-size: 0.9rem; border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 4rem; }
    </style>
</head>
<body>

    <site-toolbar root-path="../../"></site-toolbar>

    <div class="product-container" id="product-wrapper">
        <h2 style="width: 100%; text-align: center; font-weight: 300;">Loading Product...</h2>
    </div>

    <footer>&copy; 2026 Shuchiva Essentials. A brand by Nand Lal Ram Charan Dass, Dehradun.</footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const wrapper = document.getElementById('product-wrapper');

        function applyImageFallbacks() {
            const allImages = document.querySelectorAll('img');
            allImages.forEach(img => {
                img.onerror = function() {
                    if (this.src.includes('.webp')) {
                        this.src = this.src.replace('.webp', '.png');
                    } else if (this.src.includes('.png')) {
                        this.src = this.src.replace('.png', '.jpg');
                    } else if (this.src.includes('.jpg')) {
                        this.src = this.src.replace('.jpg', '.jpeg');
                    } else {
                        this.onerror = null; 
                    }
                };
            });
        }

        if (!productId) {
            wrapper.innerHTML = "<h2 style='width: 100%; text-align: center; color: red;'>Product ID missing from URL.</h2>";
        } else {
            fetch('/api/products')
                .then(res => res.json())
                .then(allProducts => {
                    const product = allProducts[productId];
                    
                    if (!product) {
                        wrapper.innerHTML = "<h2 style='width: 100%; text-align: center; color: red;'>Product not found in database.</h2>";
                        return;
                    }

                    document.title = `${product.productName} | Shuchiva Essentials`;

                    let currentSizeKey = Object.keys(product.sizes)[0];
                    let currentPackKey = Object.keys(product.sizes[currentSizeKey].packs)[0];

                    function renderProduct() {
                        const sizeData = product.sizes[currentSizeKey];
                        const packData = sizeData.packs[currentPackKey];
                        
                        const folderPath = `./${sizeData.folderName}`;
                        const mainImgPath = `${folderPath}/${packData.mainImg}`;

                        let sizeButtonsHTML = Object.keys(product.sizes).map(sKey => {
                            const isActive = sKey === currentSizeKey ? 'active' : '';
                            return `<button class="select-btn ${isActive}" data-size="${sKey}">${product.sizes[sKey].sizeText}</button>`;
                        }).join('');

                        let packButtonsHTML = Object.keys(sizeData.packs).map(pKey => {
                            const isActive = pKey === currentPackKey ? 'active' : '';
                            return `<button class="select-btn ${isActive}" data-pack="${pKey}">${pKey.toUpperCase()}</button>`;
                        }).join('');

                        let thumbsHTML = sizeData.thumbs.map((thumbFile, index) => {
                            const tPath = `${folderPath}/${thumbFile}`;
                            const isActive = index === 0 ? 'active' : '';
                            return `<div class="thumb-box ${isActive}" data-img="${tPath}"><img src="${tPath}" alt="Thumbnail" loading="lazy"></div>`;
                        }).join('');

                        wrapper.innerHTML = `
                            <div class="gallery-col">
                                <div class="main-img-box">
                                    <img src="${mainImgPath}" id="main-product-image" alt="${product.productName}" loading="lazy">
                                </div>
                                <div class="thumb-grid" id="thumbnail-container">
                                    ${thumbsHTML}
                                </div>
                            </div>
                            
                            <div class="info-col">
                                <h1 class="prod-title">${product.productName}</h1>
                                <p class="prod-desc-text">${product.catalogDescription}</p>
                                
                                <div class="prod-price-display" id="price-display">${packData.price}</div>
                                
                                <div class="option-group">
                                    <span class="option-label">Select Size</span>
                                    <div class="btn-group" id="size-selector">
                                        ${sizeButtonsHTML}
                                    </div>
                                </div>

                                <div class="option-group">
                                    <span class="option-label">Select Pack Size</span>
                                    <div class="btn-group" id="pack-selector">
                                        ${packButtonsHTML}
                                    </div>
                                </div>

                                <button class="checkout-btn" id="add-to-cart-btn">Add to Cart</button>
                                <div id="cart-message"></div>
                            </div>
                        `;

                        applyImageFallbacks();
                        attachEventListeners(packData.price);
                    }

                    function attachEventListeners(currentPrice) {
                        document.querySelectorAll('#size-selector .select-btn').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                currentSizeKey = e.target.getAttribute('data-size');
                                currentPackKey = Object.keys(product.sizes[currentSizeKey].packs)[0];
                                renderProduct();
                            });
                        });

                        document.querySelectorAll('#pack-selector .select-btn').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                currentPackKey = e.target.getAttribute('data-pack');
                                renderProduct();
                            });
                        });

                        const mainImg = document.getElementById('main-product-image');
                        const thumbs = document.querySelectorAll('.thumb-box');
                        thumbs.forEach(thumb => {
                            thumb.addEventListener('click', () => {
                                thumbs.forEach(t => t.classList.remove('active'));
                                thumb.classList.add('active');
                                mainImg.src = thumb.getAttribute('data-img');
                            });
                        });

                        // Add to Cart functionality
                        document.getElementById('add-to-cart-btn').addEventListener('click', async () => {
                            const token = localStorage.getItem('shuchiva_token');
                            const msgBox = document.getElementById('cart-message');
                            
                            if (!token) {
                                alert("Please log in or register to add items to your cart.");
                                window.location.href = '../../auth/login.html';
                                return;
                            }

                            msgBox.style.display = 'block';
                            msgBox.style.color = '#a3b3c8';
                            msgBox.textContent = 'Adding to cart...';

                            try {
                                const response = await fetch('/api/cart', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'Authorization': `Bearer ${token}`
                                    },
                                    body: JSON.stringify({
                                        productId: productId,
                                        sizeKey: currentSizeKey,
                                        packKey: currentPackKey,
                                        quantity: 1,
                                        price: currentPrice
                                    })
                                });

                                if (response.ok) {
                                    msgBox.style.color = '#4da8da';
                                    msgBox.textContent = 'Added to Cart successfully!';
                                    
                                    // 1. Broadcast signal to toolbar
                                    window.dispatchEvent(new Event('cartUpdated'));

                                    // 2. Direct command failsafe
                                    const toolbar = document.querySelector('site-toolbar');
                                    if (toolbar && typeof toolbar.updateCartQuantity === 'function') {
                                        toolbar.updateCartQuantity(token);
                                    }

                                    // Hide message after 3 seconds
                                    setTimeout(() => { msgBox.style.display = 'none'; }, 3000);
                                } else {
                                    const data = await response.json();
                                    msgBox.style.color = '#ff6b6b';
                                    msgBox.textContent = data.error || 'Failed to add to cart.';
                                }
                            } catch (error) {
                                console.error('Cart Error:', error);
                                msgBox.style.color = '#ff6b6b';
                                msgBox.textContent = 'Server error. Please try again.';
                            }
                        });
                    }

                    renderProduct();
                })
                .catch(error => {
                    console.error('API Fetch Error:', error);
                    wrapper.innerHTML = "<h2 style='width: 100%; text-align: center; color: red;'>Failed to load product data from server.</h2>";
                });
        }
    </script>

    <script src="../../homepage/toolbar.js"></script>
        <!-- APPLE-STYLE SCROLL ANIMATIONS (GSAP) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        if (typeof gsap !== 'undefined') {
            // Target every individual element to create a beautiful staggered cascade
            gsap.from("nav, .main-image-display, .thumb-box, .product-details > h1, .option-selector, .price-tag, .description-box, .amazon-btn, footer", {
                y: 40,
                opacity: 0,
                duration: 0.8,
                stagger: 0.1,
                ease: "power3.out",
                delay: 0.1
            });
        }
    </script>
</body>
</html>
