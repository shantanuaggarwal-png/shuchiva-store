<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <title>Register | Shuchiva Essentials</title>
    <style>
        body { background-color: #0d1117; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        form { max-width: 300px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        input, button { padding: 10px; border-radius: 5px; }
        button { background-color: #4da8da; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <site-toolbar root-path="../"></site-toolbar>
    
    <h2>Create Account</h2>
    <form id="reg-form">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>

    <script>
        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('http://localhost:3000/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            if (res.ok) {
                alert('Success! Please log in.');
                window.location.href = 'login.html';
            } else {
                alert('Registration failed.');
            }
        });
    </script>
    <script src="../homepage/toolbar.js"></script>
</body>
</html>
